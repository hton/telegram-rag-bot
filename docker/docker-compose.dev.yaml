version: '3.8'

services:
  pgdb:
    image: ankane/pgvector
    container_name: rag_pgdb_dev
    restart: unless-stopped
    environment:
      - POSTGRES_USER=pguser
      - POSTGRES_PASSWORD=1q2w3e4r
      - POSTGRES_DB=pgdb
    ports:
      - "5432:5432"
    volumes:
      - db_storage_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pgdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_storage_dev:
